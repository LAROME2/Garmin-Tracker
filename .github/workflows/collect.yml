name: Recolectar datos de Garmin

on:
  schedule:
    # 07:15 America/Monterrey (UTC-6) = 13:15 UTC. Ajusta si cambias de zona horaria.
    - cron: "15 13 * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Días hacia atrás a traer (déjalo vacío para el modo normal de 5 días)"
        required: false
        default: ""

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r collector/requirements.txt

      - name: Correr recolector
        env:
          GARMIN_TOKENS_B64: ${{ secrets.GARMIN_TOKENS_B64 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days }}
        run: python collector/fetch_garmin.py
