<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mi Garmin</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0f172a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Mi Garmin" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px 16px 48px;
    background: #0f172a; color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 1.3rem; margin: 4px 0 20px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 22px; }
  .card { background: #1e293b; border-radius: 14px; padding: 14px 16px; }
  .card .label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: .04em; }
  .card .value { font-size: 1.6rem; font-weight: 600; margin-top: 4px; }
  .chart-card { background: #1e293b; border-radius: 14px; padding: 16px; margin-bottom: 22px; }
  .chart-card h2 { font-size: 0.95rem; color: #cbd5e1; margin: 0 0 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #334155; }
  th { color: #94a3b8; font-weight: 500; }
  #status { color: #94a3b8; font-size: 0.85rem; }
  canvas { max-width: 100%; }
</style>
</head>
<body>
<h1>🏃 Mi Garmin</h1>
<div id="status">Cargando…</div>
<div id="app" style="display:none">

  <div class="grid" id="summaryCards"></div>

  <div class="chart-card">
    <h2>Kilometraje semanal (carreras)</h2>
    <canvas id="weeklyKm"></canvas>
  </div>

  <div class="chart-card">
    <h2>Frecuencia cardiaca en reposo</h2>
    <canvas id="restingHr"></canvas>
  </div>

  <div class="chart-card">
    <h2>Sueño (score) y pasos</h2>
    <canvas id="sleepSteps"></canvas>
  </div>

  <div class="chart-card">
    <h2>Últimas carreras</h2>
    <table>
      <thead><tr><th>Fecha</th><th>Km</th><th>Ritmo /km</th><th>FC prom</th></tr></thead>
      <tbody id="runsTable"></tbody>
    </table>
  </div>

</div>

<script>
const params = new URLSearchParams(location.search);
const token = params.get("token") || localStorage.getItem("garmin_token") || "";
if (token) localStorage.setItem("garmin_token", token);

const statusEl = document.getElementById("status");
const appEl = document.getElementById("app");

function fmtPace(minPerKm) {
  if (!minPerKm) return "–";
  const m = Math.floor(minPerKm);
  const s = Math.round((minPerKm - m) * 60);
  return `${m}:${String(s).padStart(2, "0")}`;
}

async function load() {
  if (!token) {
    statusEl.textContent = "Falta el token de acceso. Abre el enlace completo que te dio Claude (con ?token=...).";
    return;
  }
  let resp;
  try {
    resp = await fetch(`/api/data?token=${encodeURIComponent(token)}&days=120`);
  } catch (e) {
    statusEl.textContent = "No se pudo conectar con el servidor.";
    return;
  }
  if (resp.status === 401) {
    statusEl.textContent = "Token inválido.";
    return;
  }
  if (!resp.ok) {
    statusEl.textContent = "Error cargando datos (" + resp.status + ").";
    return;
  }

  const { daily, activities } = await resp.json();
  statusEl.style.display = "none";
  appEl.style.display = "block";

  renderSummary(daily, activities);
  renderWeeklyKm(activities);
  renderRestingHr(daily);
  renderSleepSteps(daily);
  renderRunsTable(activities);
}

function renderSummary(daily, activities) {
  const last = daily[daily.length - 1] || {};
  const runs = activities.filter(a => (a.activity_type || "").includes("running"));
  const last30 = runs.filter(a => new Date(a.start_time) > new Date(Date.now() - 30 * 86400000));
  const kmLast30 = last30.reduce((s, a) => s + (a.distance_m || 0), 0) / 1000;

  const cards = [
    { label: "Pasos (último día)", value: last.steps ?? "–" },
    { label: "FC reposo", value: last.resting_hr ?? "–" },
    { label: "Sueño (score)", value: last.sleep_score ?? "–" },
    { label: "Km corridos (30d)", value: kmLast30 ? kmLast30.toFixed(1) : "–" },
  ];
  document.getElementById("summaryCards").innerHTML = cards.map(c =>
    `<div class="card"><div class="label">${c.label}</div><div class="value">${c.value}</div></div>`
  ).join("");
}

function isoWeek(dateStr) {
  const d = new Date(dateStr);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
  const week1 = new Date(d.getFullYear(), 0, 4);
  const weekNum = 1 + Math.round(((d - week1) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
  return `${d.getFullYear()}-W${String(weekNum).padStart(2, "0")}`;
}

function renderWeeklyKm(activities) {
  const runs = activities.filter(a => (a.activity_type || "").includes("running"));
  const byWeek = {};
  runs.forEach(a => {
    const wk = isoWeek(a.start_time);
    byWeek[wk] = (byWeek[wk] || 0) + (a.distance_m || 0) / 1000;
  });
  const weeks = Object.keys(byWeek).sort();
  new Chart(document.getElementById("weeklyKm"), {
    type: "bar",
    data: {
      labels: weeks,
      datasets: [{ label: "Km", data: weeks.map(w => byWeek[w].toFixed(1)), backgroundColor: "#38bdf8" }],
    },
    options: baseOptions(),
  });
}

function renderRestingHr(daily) {
  new Chart(document.getElementById("restingHr"), {
    type: "line",
    data: {
      labels: daily.map(d => d.date),
      datasets: [{ label: "FC reposo", data: daily.map(d => d.resting_hr), borderColor: "#f97316", tension: 0.3 }],
    },
    options: baseOptions(),
  });
}

function renderSleepSteps(daily) {
  new Chart(document.getElementById("sleepSteps"), {
    data: {
      labels: daily.map(d => d.date),
      datasets: [
        { type: "line", label: "Sueño (score)", data: daily.map(d => d.sleep_score), borderColor: "#a78bfa", yAxisID: "y", tension: 0.3 },
        { type: "bar", label: "Pasos", data: daily.map(d => d.steps), backgroundColor: "#22c55e88", yAxisID: "y1" },
      ],
    },
    options: {
      ...baseOptions(),
      scales: {
        y: { position: "left", grid: { color: "#334155" }, ticks: { color: "#94a3b8" } },
        y1: { position: "right", grid: { display: false }, ticks: { color: "#94a3b8" } },
        x: { grid: { color: "#334155" }, ticks: { color: "#94a3b8" } },
      },
    },
  });
}

function renderRunsTable(activities) {
  const runs = activities
    .filter(a => (a.activity_type || "").includes("running"))
    .slice(0, 10);
  document.getElementById("runsTable").innerHTML = runs.map(a => `
    <tr>
      <td>${new Date(a.start_time).toLocaleDateString()}</td>
      <td>${a.distance_m ? (a.distance_m / 1000).toFixed(2) : "–"}</td>
      <td>${fmtPace(a.avg_pace_min_km)}</td>
      <td>${a.avg_hr ?? "–"}</td>
    </tr>
  `).join("") || "<tr><td colspan=4>Sin carreras en el rango.</td></tr>";
}

function baseOptions() {
  return {
    responsive: true,
    plugins: { legend: { labels: { color: "#e2e8f0" } } },
    scales: {
      x: { grid: { color: "#334155" }, ticks: { color: "#94a3b8" } },
      y: { grid: { color: "#334155" }, ticks: { color: "#94a3b8" } },
    },
  };
}

load();
</script>
</body>
</html>
