<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mi Garmin</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0d0d0d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Mi Garmin" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<h1>🏃 Mi Garmin</h1>
<p class="subtitle">Últimos 120 días</p>
<nav class="tabs">
  <a href="index.html" class="active">Resumen</a>
  <a href="coach.html">Running Coach</a>
</nav>

<div id="status">Cargando…</div>
<div id="app" style="display:none">

  <div class="grid" id="summaryCards"></div>

  <div class="card primary">
    <h2>Carreras — kilometraje semanal</h2>
    <p class="caption">Suma de distancia por semana ISO</p>
    <canvas id="weeklyKm" height="140"></canvas>
  </div>

  <div class="card primary">
    <h2>Sueño — puntaje</h2>
    <p class="caption">Score diario de Garmin (0–100)</p>
    <canvas id="sleepScore" height="140"></canvas>
  </div>

  <div class="secondary-row">
    <div class="card secondary">
      <h2 class="small">Pasos diarios</h2>
      <canvas id="stepsChart" height="110"></canvas>
    </div>
    <div class="card secondary">
      <h2 class="small">Frecuencia cardiaca en reposo</h2>
      <canvas id="restingHr" height="110"></canvas>
    </div>
  </div>

  <div class="card">
    <h2>Últimas carreras</h2>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>Fecha</th><th>Km</th><th>Ritmo /km</th><th>FC prom</th><th>Cadencia</th></tr></thead>
        <tbody id="runsTable"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
const params = new URLSearchParams(location.search);
const token = params.get("token") || localStorage.getItem("garmin_token") || "";
if (token) localStorage.setItem("garmin_token", token);

// que el link a Running Coach conserve el token
document.querySelectorAll("nav.tabs a").forEach(a => {
  if (token && !a.href.includes("token=")) {
    a.href = a.getAttribute("href") + "?token=" + encodeURIComponent(token);
  }
});

const statusEl = document.getElementById("status");
const appEl = document.getElementById("app");

const INK_2 = getCss("--ink-2"), INK_MUTED = getCss("--ink-muted"), GRID = getCss("--grid");
function getCss(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function fmtPace(minPerKm) {
  if (!minPerKm) return "–";
  const m = Math.floor(minPerKm);
  const s = Math.round((minPerKm - m) * 60);
  return `${m}:${String(s).padStart(2, "0")}`;
}

async function load() {
  if (!token) {
    statusEl.textContent = "Falta el token de acceso. Abre el enlace completo que te dio Claude (con ?token=...).";
    return;
  }
  let resp;
  try {
    resp = await fetch(`/api/data?token=${encodeURIComponent(token)}&days=120`);
  } catch (e) {
    statusEl.textContent = "No se pudo conectar con el servidor.";
    return;
  }
  if (resp.status === 401) { statusEl.textContent = "Token inválido."; return; }
  if (!resp.ok) { statusEl.textContent = "Error cargando datos (" + resp.status + ")."; return; }

  const { daily, activities } = await resp.json();
  statusEl.style.display = "none";
  appEl.style.display = "block";

  renderSummary(daily, activities);
  renderWeeklyKm(activities);
  renderSleepScore(daily);
  renderSteps(daily);
  renderRestingHr(daily);
  renderRunsTable(activities);
}

function renderSummary(daily, activities) {
  const last = daily[daily.length - 1] || {};
  const runs = activities.filter(a => (a.activity_type || "").includes("running"));
  const last30 = runs.filter(a => new Date(a.start_time) > new Date(Date.now() - 30 * 86400000));
  const kmLast30 = last30.reduce((s, a) => s + (a.distance_m || 0), 0) / 1000;

  const cards = [
    { label: "Sueño (score)", value: last.sleep_score ?? "–" },
    { label: "Km corridos", value: kmLast30 ? kmLast30.toFixed(1) : "–", unit: "30d" },
    { label: "Pasos", value: last.steps ?? "–" },
    { label: "FC reposo", value: last.resting_hr ?? "–" },
  ];
  document.getElementById("summaryCards").innerHTML = cards.map(c =>
    `<div class="tile"><div class="label">${c.label}</div><div class="value">${c.value}${c.unit ? `<span class="unit">${c.unit}</span>` : ""}</div></div>`
  ).join("");
}

function isoWeek(dateStr) {
  const d = new Date(dateStr);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
  const week1 = new Date(d.getFullYear(), 0, 4);
  const weekNum = 1 + Math.round(((d - week1) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
  return `${String(d.getMonth()+1).padStart(2,"0")}/${d.getDate()}`;
}

function noLegend() {
  return { plugins: { legend: { display: false }, tooltip: tooltipStyle() } };
}
function tooltipStyle() {
  return {
    backgroundColor: "#1a1a19", borderColor: "rgba(255,255,255,0.10)", borderWidth: 1,
    titleColor: "#ffffff", bodyColor: "#c3c2b7", padding: 10, cornerRadius: 8,
    displayColors: false,
  };
}
function axisStyle() {
  return {
    x: { grid: { color: GRID, drawTicks: false }, ticks: { color: INK_MUTED, font: { size: 11 } }, border: { color: GRID } },
    y: { grid: { color: GRID, drawTicks: false }, ticks: { color: INK_MUTED, font: { size: 11 } }, border: { display: false }, beginAtZero: true },
  };
}

function renderWeeklyKm(activities) {
  const runs = activities.filter(a => (a.activity_type || "").includes("running"));
  const byWeek = {};
  runs.forEach(a => {
    const wk = isoWeek(a.start_time);
    byWeek[wk] = (byWeek[wk] || 0) + (a.distance_m || 0) / 1000;
  });
  const weeks = Object.keys(byWeek);
  new Chart(document.getElementById("weeklyKm"), {
    type: "bar",
    data: {
      labels: weeks,
      datasets: [{
        data: weeks.map(w => byWeek[w].toFixed(1)),
        backgroundColor: getCss("--blue"),
        borderRadius: 4, borderSkipped: false,
        maxBarThickness: 24, categoryPercentage: 0.7,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: axisStyle(),
      plugins: { legend: { display: false }, tooltip: { ...tooltipStyle(), callbacks: { label: c => `${c.formattedValue} km` } } },
    },
  });
}

function renderSleepScore(daily) {
  new Chart(document.getElementById("sleepScore"), {
    type: "line",
    data: {
      labels: daily.map(d => isoWeek(d.date)),
      datasets: [{
        data: daily.map(d => d.sleep_score),
        borderColor: getCss("--aqua"), backgroundColor: hexAlpha(getCss("--aqua"), 0.10),
        borderWidth: 2, pointRadius: 0, pointHoverRadius: 5,
        pointBackgroundColor: getCss("--aqua"), pointBorderColor: "#1a1a19", pointBorderWidth: 2,
        fill: true, tension: 0.25, spanGaps: true,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: { ...axisStyle(), y: { ...axisStyle().y, suggestedMin: 0, suggestedMax: 100 } },
      plugins: { legend: { display: false }, tooltip: tooltipStyle() },
    },
  });
}

function renderSteps(daily) {
  new Chart(document.getElementById("stepsChart"), {
    type: "bar",
    data: {
      labels: daily.map(d => isoWeek(d.date)),
      datasets: [{ data: daily.map(d => d.steps), backgroundColor: hexAlpha(getCss("--violet"), 0.75), borderRadius: 3, maxBarThickness: 8 }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: { x: { display: false }, y: { ...axisStyle().y, ticks: { color: INK_MUTED, font: { size: 10 } } } },
      plugins: { legend: { display: false }, tooltip: tooltipStyle() },
    },
  });
}

function renderRestingHr(daily) {
  new Chart(document.getElementById("restingHr"), {
    type: "line",
    data: {
      labels: daily.map(d => isoWeek(d.date)),
      datasets: [{
        data: daily.map(d => d.resting_hr),
        borderColor: getCss("--orange"), borderWidth: 2, pointRadius: 0, pointHoverRadius: 5,
        pointBackgroundColor: getCss("--orange"), pointBorderColor: "#1a1a19", pointBorderWidth: 2,
        tension: 0.25, spanGaps: true,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: { x: { display: false }, y: { ...axisStyle().y, ticks: { color: INK_MUTED, font: { size: 10 } } } },
      plugins: { legend: { display: false }, tooltip: tooltipStyle() },
    },
  });
}

function hexAlpha(hex, alpha) {
  const h = hex.replace("#", "");
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function renderRunsTable(activities) {
  const runs = activities
    .filter(a => (a.activity_type || "").includes("running"))
    .slice(0, 10);
  document.getElementById("runsTable").innerHTML = runs.map(a => `
    <tr>
      <td>${new Date(a.start_time).toLocaleDateString()}</td>
      <td>${a.distance_m ? (a.distance_m / 1000).toFixed(2) : "–"}</td>
      <td>${fmtPace(a.avg_pace_min_km)}</td>
      <td>${a.avg_hr ?? "–"}</td>
      <td>${a.cadence_spm ?? "–"}</td>
    </tr>
  `).join("") || `<tr><td colspan="5">Sin carreras en el rango.</td></tr>`;
}

load();
</script>
</body>
</html>
